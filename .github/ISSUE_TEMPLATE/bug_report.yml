name: 🐛 Bug Report
description: Something in the bot isn't working right
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out as much of this as you can.

  - type: input
    id: game-feature
    attributes:
      label: Which game or feature is affected?
      placeholder: e.g. Buckshot, Fast Math, Counting
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Tell us what went wrong
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make the bug happen again?
      placeholder: |
        1. Run /command
        2. Do this
        3. See error
    validations:
      required: true

  - type: input
    id: server-id
    attributes:
      label: Server ID (optional)
      description: The Discord server ID where this happened, if relevant
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or error messages
      description: Drag and drop images here, or paste any error text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues to make sure this hasn't already been reported
          required: true